name: reference-tests

on:
  push:
    paths:
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/reference-tests.yml"
  pull_request:
    paths:
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
